name: Security Audit

on:
  schedule:
    # Runs at 00:00 UTC everyday
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  advisories:
    name: Audit (advisories)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run audit:advisories
        shell: bash

  policy:
    name: Audit (bans, licenses, sources)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: jdx/mise-action@v5.2.4
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run audit:policy
        shell: bash

  audit-complete:
    name: audit-complete
    if: ${{ always() }}
    # Wait for both cargo-deny jobs to finish so their results are visible, but
    # only require policy checks to pass so newly disclosed advisories do not
    # suddenly fail the required status check.
    needs:
      - advisories
      - policy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Audit complete
        env:
          RESULT: ${{ needs['policy'].result == 'success' }}
        run: |
          if "${RESULT}"; then
            echo "Audit succeeded"
          else
            echo "Audit failed"
            exit 1
          fi
        shell: bash
