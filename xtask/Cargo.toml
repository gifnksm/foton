[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cargo_metadata = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive", "env"] }
color-eyre = "0.6.5"
derive_more = { version = "2.1.1", features = ["display", "is_variant"] }
directories = "6.0.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6.1"
wsbx = "0.1.0"

[lints]
workspace = true
