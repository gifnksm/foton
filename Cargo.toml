[package]
name = "foton"
version = "0.1.2"
edition = "2024"
rust-version = "1.96.0"
description = "A font package manager for Windows that works without administrator privileges."
readme = "README.md"
repository = "https://github.com/gifnksm/foton"
license = "MIT OR Apache-2.0"
keywords = ["font", "font-installer", "font-manager", "package-manager", "windows"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.cargo-sync-rdme.badge]
style = "flat-square"

[package.metadata.cargo-sync-rdme.badge.badges]
maintenance = true
license = { link = "#license" }
crates-io = true
rust-version = true
github-actions = { workflows = "ci.yml" }
codecov = { component = "foton" }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[package.metadata.winresource]
OriginalFilename = "foton.exe"
InternalName = "foton"
LegalCopyright = "Copyright (c) 2026 gifnksm"
CompanyName = "gifnksm"
FileDescription = "foton font package manager"

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.lints.clippy]
# Restriction group
allow_attributes = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
doc_paragraphs_missing_punctuation = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
map_err_ignore = "warn"
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unnecessary_self_imports = "warn"
unused_trait_names = "warn"
verbose_file_reads = "warn"

[workspace.lints.rust]
absolute-paths-not-starting-with-crate = "warn"
deprecated-in-future = "warn"
elided-lifetimes-in-paths = "warn"
macro-use-extern-crate = "warn"
missing-copy-implementations = "warn"
missing-debug-implementations = "warn"
redundant-lifetimes = "warn"
unused-extern-crates = "warn"
unused-import-braces = "warn"
unused-lifetimes = "warn"
unused-macro-rules = "warn"
unused-qualifications = "warn"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
clap_mangen = "0.3"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
console = "0.16.4"
derive_more = { version = "2.1.1", features = ["display", "from", "is_variant"] }
dialoguer = { version = "0.12.0", default-features = false }
directories = "6.0.0"
dunce = "1.0.5"
either = "1.18.0"
futures-core = "0.3.34"
futures-util = "0.3.34"
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
glob = "0.3.4"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "native-tls", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
snafu = "0.9.2"
spdx = "0.13.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "rt-multi-thread", "signal"] }
tokio-util = "0.7.19"
toml = "1.1.4"
url = { version = "2.5.8", features = ["serde"] }
wild = "2.2.1"
windows = {
  version = "0.62.2",
  features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
  ]
}
windows-core = "0.62.2"
windows-registry = "0.6.1"
windows-result = "0.4.1"
zip = "8.6.0"

[dev-dependencies]
indoc = "2.0.7"
tokio = { version = "1.53.1", features = ["macros"] }

[build-dependencies]
winresource = "0.1.31"

[badges]
maintenance = { status = "actively-developed" }

[lints]
workspace = true

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
